name: Data Processing Workflow

on:
  workflow_dispatch:   # allows manual trigger
  schedule:
    - cron: "15 8 * * *"   # every day at 2 AM UTC

jobs:
  process-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google API token files
        run: |
          mkdir -p scripts/credentials
          echo "${{ secrets.GOOGLE_API_TOKEN_B64 }}" | base64 --decode > scripts/credentials/token.json


      - name: Unzip cari software
        run: |
          unzip scripts/cari_7Aexe.zip -d scripts
          chmod +x scripts/CARI_7A_DVD/cari7a_4.2.0\(intel_linux\)

          
      - name: Run data processing script
        run: python scripts/coa_automation_script.py
